<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css">
    <link rel="stylesheet" th:href="@{/css/app.css}">
    <title data-i18n-title="page.login.title">Sign in | R2ModSync</title>
</head>
<body class="auth-page">
<header class="site-header">
    <nav class="site-nav" aria-label="Main navigation" data-i18n-aria-label="nav.mainNavigation">
        <a class="brand" th:href="@{/}" aria-label="R2ModSync home" data-i18n-aria-label="brand.home">
            <span class="brand-mark" aria-hidden="true">r2</span>
            <span>R2ModSync</span>
        </a>
        <div class="nav-actions">
            <label class="language-picker">
                <span class="visually-hidden" data-i18n="language.label">Language</span>
                <select class="language-select" aria-label="Language" data-i18n-aria-label="language.label">
                    <option value="en">English</option>
                    <option value="pl">Polski</option>
                </select>
            </label>
            <a class="nav-link" th:href="@{/}" data-i18n="nav.home">Back to home</a>
        </div>
    </nav>
</header>
<main class="auth-main">
    <article class="auth-card">
        <div class="auth-card-heading">
            <p class="eyebrow" data-i18n="login.eyebrow">WELCOME BACK</p>
            <h1 data-i18n="nav.signIn">Sign in</h1>
            <p data-i18n="login.description">Sign in to continue to your mod workspace.</p>
        </div>
        <section class="auth-card-content">
            <p th:if="${param.error}" class="status-message error-message" role="alert" data-i18n="login.error">Username or password is incorrect.</p>
            <p th:if="${param.logout}" class="status-message" data-i18n="login.logout">You have been signed out.</p>
            <form th:action="@{/login}" method="post">
                <label for="username">
                    <span data-i18n="login.username">Username</span>
                    <input id="username" name="text" type="text" autocomplete="username" placeholder="Your username" data-i18n-placeholder="login.usernamePlaceholder" required>
                </label>
                <label for="password">
                    <span data-i18n="login.password">Password</span>
                    <input id="password" name="password" type="password" autocomplete="current-password" placeholder="Your password" data-i18n-placeholder="login.passwordPlaceholder" required>
                </label>
                <button type="submit"><span data-i18n="nav.signIn">Sign in</span> <span class="button-arrow" aria-hidden="true">→</span></button>
            </form>
        </section>
    </article>
</main>
<script th:src="@{/js/i18n.js}" defer></script>
</body>
</html>
