spring:
  application:
    name: r2mod-sync
  mvc:
    static-path-pattern: /**
  web:
    resources:
      static-locations: classpath:/static/

server:
  port:  "${PORT:8080}"

game-server:
  type: "${GAME_SERVER_TYPE:DOCKER}"
  process-name: "${PROCESS_NAME:valheim}"
  status: running
  mod-directory: "${MOD_DIRECTORY:~/server}"

directory:
 workspace: "${WORKSPACE_DIR:~/r2z-dir}"

app:
  tmp-dir: "${TMP_DIR:/tmp}"

security:
  email: "${USER:admin}"
  password: "${PASSWORD:admin}"

